[package]
name = "bludio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "A GPUI Bluetooth and audio device manager for Linux"
license = "MIT"
repository = "https://github.com/toomosin/bludio"
keywords = ["bluetooth", "audio", "pulseaudio", "gui", "linux"]
categories = ["gui", "hardware-support"]

[[bin]]
name = "bludio"
path = "src/main.rs"

[dependencies]
gpui-unofficial = "1.2.7"
gpui-platform-gpui-unofficial = { version = "1.2.7", features = ["font-kit", "x11", "wayland"] }
bluer = { version = "0.17", features = ["bluetoothd"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
futures = "0.3"
libpulse-binding = { version = "2.30.1", features = ["pa_v15"] }
libpulse-sys = "1.23"
serde_json = "1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
rust-embed = { version = "8", features = ["include-exclude"] }
anyhow = "1"

[patch.crates-io]
libpulse-binding = { git = "https://github.com/radther/pulse-binding-rust", rev = "7adc0a391db7c885e13378c3c62a67f3a7ec2ad9" }
libpulse-sys = { git = "https://github.com/radther/pulse-binding-rust", rev = "7adc0a391db7c885e13378c3c62a67f3a7ec2ad9" }
